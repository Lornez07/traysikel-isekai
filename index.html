<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traysikel Isekai — Endless Runner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a12;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
}

.game-wrapper {
  position: relative;
  border-radius: 20px;
  padding: 4px;
  background: linear-gradient(135deg, #6366f1, #a78bfa, #6366f1);
  box-shadow: 0 0 60px rgba(99,102,241,0.25), 0 0 120px rgba(168,85,247,0.1);
}

canvas {
  display: block;
  border-radius: 16px;
  background: #0f0f1a;
  width: 400px;
  height: 600px;
}
</style>
</head>
<body>

<div class="game-wrapper">
  <canvas id="game" width="400" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 600;

// ── Game State ──
const state = {
  score: 0,
  gold: 0,
  gems: 0,
  gameOver: false,
  started: false,
  speed: 3,
  baseSpeed: 3,
  maxSpeed: 12,
  roadOffset: 0,
  frame: 0,
};

// ── Player (Tricycle) ──
const player = {
  x: 200, y: 500,
  w: 44, h: 36,
  speed: 5,
  vx: 0,
};

// ── Entities ──
let obstacles = [];
let collectibles = [];
let particles = [];
let spawnTimer = 0;

// ── Controls ──
const keys = { left: false, right: false };

// ── Helpers ──
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

// ── Spawning ──
const OBSTACLE_TYPES = [
  { name: 'pothole', color: '#1a1a2e', size: 28, inner: '#16213e', points: 0 },
  { name: 'portal',  color: '#7c3aed', size: 30, inner: '#a78bfa', points: 0, glow: true },
  { name: 'slime',   color: '#22c55e', size: 32, inner: '#4ade80', points: 0, eyes: true },
];

const COLLECTIBLE_TYPES = [
  { name: 'coin', color: '#facc15', size: 12, valueType: 'gold', value: 5, shine: true },
  { name: 'gem',  color: '#22d3ee', size: 10, valueType: 'gems', value: 1, shape: 'diamond' },
];

function spawnObstacle() {
  const type = OBSTACLE_TYPES[randInt(0, OBSTACLE_TYPES.length - 1)];
  const lane = randInt(0, 3);
  const laneX = 60 + lane * 93;
  obstacles.push({
    x: laneX - type.size / 2 + rand(-8, 8),
    y: -type.size,
    w: type.size,
    h: type.size,
    type,
    speed: state.speed * (0.7 + rand(0, 0.4)),
  });
}

function spawnCollectible() {
  const type = COLLECTIBLE_TYPES[randInt(0, COLLECTIBLE_TYPES.length - 1)];
  const lane = randInt(0, 3);
  const laneX = 60 + lane * 93;
  collectibles.push({
    x: laneX - type.size / 2 + rand(-10, 10),
    y: -type.size,
    w: type.size * 2,
    h: type.size * 2,
    type,
    speed: state.speed * (0.6 + rand(0, 0.3)),
    bob: rand(0, Math.PI * 2),
  });
}

// ── Particles ──
function emitParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = rand(0, Math.PI * 2);
    const speed = rand(1, 4);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + rand(0, 0.02),
      size: rand(3, 7),
      color,
    });
  }
}

// ── Drawing ──

function drawRoad() {
  // Base road
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(40, 0, 320, H);

  // Road edges
  ctx.fillStyle = '#2d2d4a';
  ctx.fillRect(38, 0, 4, H);
  ctx.fillRect(358, 0, 4, H);

  // Lane markings (dashed)
  const laneW = 2, laneH = 24;
  ctx.fillStyle = '#3d3d5c';
  for (let l = 0; l < 4; l++) {
    const lx = 40 + 8 + l * 80;
    for (let y = -laneH + (state.roadOffset % (laneH * 3)); y < H + laneH; y += laneH * 3) {
      ctx.fillRect(lx, y, laneW, laneH);
    }
  }

  // Center line
  ctx.fillStyle = '#4a4a7a';
  const clx = 40 + 159;
  for (let y = -laneH + (state.roadOffset % (laneH * 3)); y < H + laneH; y += laneH * 3) {
    ctx.fillRect(clx, y, 2, laneH);
  }
}

function drawTricycle() {
  const p = player;
  const cx = p.x, cy = p.y;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx + 2, cy + 20, 24, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Main body (sidecar + motorcycle)
  const grad = ctx.createLinearGradient(cx - 22, cy, cx + 22, cy);
  grad.addColorStop(0, '#4f46e5');
  grad.addColorStop(0.5, '#7c3aed');
  grad.addColorStop(1, '#6366f1');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(cx - 22, cy - 10, 44, 24, 6);
  ctx.fill();

  // Body border glow
  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#a78bfa';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.roundRect(cx - 22, cy - 10, 44, 24, 6);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Windshield
  ctx.fillStyle = 'rgba(167,139,250,0.3)';
  ctx.beginPath();
  ctx.roundRect(cx + 10, cy - 8, 10, 8, 3);
  ctx.fill();

  // Sidecar
  ctx.fillStyle = '#3730a3';
  ctx.beginPath();
  ctx.roundRect(cx - 28, cy + 2, 16, 14, 4);
  ctx.fill();
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(cx - 28, cy + 2, 16, 14, 4);
  ctx.stroke();

  // Wheels
  const wheelPositions = [
    { x: cx - 16, y: cy + 18 },
    { x: cx + 6, y: cy + 18 },
    { x: cx - 22, y: cy + 18 },
  ];
  for (const w of wheelPositions) {
    ctx.shadowColor = '#818cf8';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#1e1b4b';
    ctx.beginPath();
    ctx.arc(w.x, w.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#4338ca';
    ctx.beginPath();
    ctx.arc(w.x, w.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Neon accent strip
  ctx.fillStyle = '#c084fc';
  ctx.shadowColor = '#c084fc';
  ctx.shadowBlur = 10;
  ctx.fillRect(cx - 18, cy + 4, 36, 2);
  ctx.shadowBlur = 0;

  // Handlebar
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + 14, cy - 10);
  ctx.lineTo(cx + 20, cy - 16);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 14, cy - 10);
  ctx.lineTo(cx + 18, cy - 16);
  ctx.stroke();

  // Headlight
  ctx.fillStyle = '#fef08a';
  ctx.shadowColor = '#fef08a';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.arc(cx + 21, cy - 2, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawObstacle(o) {
  const t = o.type;
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  const s = o.w;

  ctx.save();

  if (t.name === 'pothole') {
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.ellipse(cx, cy, s / 2, s / 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = t.inner;
    ctx.beginPath();
    ctx.ellipse(cx - 2, cy + 2, s / 3, s / 5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (t.name === 'portal') {
    const pulse = Math.sin(state.frame * 0.05 + o.y) * 3;
    ctx.shadowColor = '#a78bfa';
    ctx.shadowBlur = 20 + pulse;
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, s / 2 + pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, s / 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(124,58,237,0.15)';
    ctx.beginPath();
    ctx.arc(cx, cy, s / 2.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (t.name === 'slime') {
    const squish = Math.sin(state.frame * 0.08 + o.x) * 2;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 2, s / 2 + squish, s / 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = t.inner;
    ctx.beginPath();
    ctx.ellipse(cx - 4, cy - 3, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 4, cy - 3, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // pupils
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath();
    ctx.arc(cx - 5, cy - 4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + 3, cy - 4, 2, 0, Math.PI * 2);
    ctx.fill();
    // mouth
    ctx.strokeStyle = '#166534';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy + 4, 5, 0, Math.PI);
    ctx.stroke();
  }

  ctx.restore();
}

function drawCollectible(c) {
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2 + Math.sin(c.bob + state.frame * 0.06) * 3;
  const t = c.type;
  const s = t.size;

  ctx.save();

  if (t.name === 'coin') {
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(cx, cy, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(cx - 2, cy - 2, s * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eab308';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', cx + 1, cy + 1);
  } else if (t.name === 'gem') {
    const gs = s * 1.5;
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath();
    ctx.moveTo(cx, cy - gs);
    ctx.lineTo(cx + gs * 0.6, cy);
    ctx.lineTo(cx, cy + gs);
    ctx.lineTo(cx - gs * 0.6, cy);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#99f6e4';
    ctx.beginPath();
    ctx.moveTo(cx - 1, cy - gs * 0.5);
    ctx.lineTo(cx + gs * 0.25, cy);
    ctx.lineTo(cx - 1, cy + gs * 0.5);
    ctx.lineTo(cx - gs * 0.25, cy);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawHUD() {
  // Top bar
  ctx.fillStyle = 'rgba(15,15,26,0.85)';
  ctx.beginPath();
  ctx.roundRect(8, 8, W - 16, 44, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(99,102,241,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(8, 8, W - 16, 44, 10);
  ctx.stroke();

  ctx.font = 'bold 18px Orbitron, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  // Score
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('SCORE', 22, 20);
  ctx.fillStyle = '#a78bfa';
  ctx.font = 'bold 22px Orbitron, monospace';
  ctx.fillText(String(state.score).padStart(6, '0'), 22, 44);

  // Gold
  ctx.font = 'bold 14px Rajdhani, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#facc15';
  ctx.shadowColor = '#facc15';
  ctx.shadowBlur = 6;
  ctx.fillText('◆ ' + state.gold, W - 22, 22);
  ctx.shadowBlur = 0;

  // Gems
  ctx.fillStyle = '#22d3ee';
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 6;
  ctx.fillText('✦ ' + state.gems, W - 22, 42);
  ctx.shadowBlur = 0;
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(15,15,26,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title
  ctx.font = 'bold 36px Orbitron, monospace';
  ctx.fillStyle = '#c084fc';
  ctx.shadowColor = '#a78bfa';
  ctx.shadowBlur = 30;
  ctx.fillText('TRAYSIKEL', W / 2, H / 2 - 80);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 14px Orbitron, monospace';
  ctx.fillStyle = '#6366f1';
  ctx.fillText('ISEKAI', W / 2, H / 2 - 55);

  // Subtitle
  ctx.font = '16px Rajdhani, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('Endless Runner', W / 2, H / 2 - 20);

  // Controls info
  ctx.font = '14px Rajdhani, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('← → or A D to move', W / 2, H / 2 + 30);

  // Start prompt
  ctx.font = 'bold 18px Rajdhani, sans-serif';
  ctx.fillStyle = '#a78bfa';
  const pulse = Math.sin(state.frame * 0.04) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillText('PRESS SPACE TO START', W / 2, H / 2 + 90);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(15,15,26,0.8)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 32px Orbitron, monospace';
  ctx.fillStyle = '#ef4444';
  ctx.shadowColor = '#ef4444';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W / 2, H / 2 - 70);
  ctx.shadowBlur = 0;

  ctx.font = '18px Rajdhani, sans-serif';
  ctx.fillStyle = '#cbd5e1';
  ctx.fillText('Final Score', W / 2, H / 2 - 25);

  ctx.font = 'bold 42px Orbitron, monospace';
  ctx.fillStyle = '#c084fc';
  ctx.fillText(String(state.score), W / 2, H / 2 + 25);

  ctx.font = '15px Rajdhani, sans-serif';
  ctx.fillStyle = '#facc15';
  ctx.fillText('◆ ' + state.gold + '  ✦ ' + state.gems, W / 2, H / 2 + 65);

  ctx.font = 'bold 16px Rajdhani, sans-serif';
  ctx.fillStyle = '#a78bfa';
  const pulse = Math.sin(state.frame * 0.04) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillText('PRESS SPACE TO RESTART', W / 2, H / 2 + 125);
  ctx.globalAlpha = 1;
}

// ── Collision ──
function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── Update ──
function update() {
  if (state.gameOver || !state.started) return;

  state.frame++;

  // Difficulty scaling
  state.speed = Math.min(state.maxSpeed, state.baseSpeed + state.score * 0.04);
  state.roadOffset += state.speed * 2;

  // Player movement
  player.vx = 0;
  if (keys.left) player.vx = -player.speed;
  if (keys.right) player.vx = player.speed;
  player.x += player.vx;
  player.x = Math.max(56, Math.min(W - 56, player.x));

  // Spawn obstacles
  spawnTimer++;
  const spawnRate = Math.max(25, 70 - state.speed * 3);
  if (spawnTimer > spawnRate) {
    spawnTimer = 0;
    if (Math.random() < 0.6) spawnObstacle();
    if (Math.random() < 0.35) spawnCollectible();
  }

  // Move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += o.speed;
    if (o.y > H + 20) { obstacles.splice(i, 1); continue; }

    // Collision with player
    if (rectCollide(player, o)) {
      emitParticles(player.x, player.y, '#ef4444', 20);
      emitParticles(player.x, player.y, '#facc15', 8);
      state.gameOver = true;
      return;
    }
  }

  // Move collectibles
  for (let i = collectibles.length - 1; i >= 0; i--) {
    const c = collectibles[i];
    c.y += c.speed;
    c.bob += 0.03;
    if (c.y > H + 20) { collectibles.splice(i, 1); continue; }

    // Collision with player
    if (rectCollide(player, c)) {
      if (c.type.valueType === 'gold') {
        state.gold += c.type.value;
        emitParticles(c.x + c.w / 2, c.y + c.h / 2, '#facc15', 8);
      } else {
        state.gems += c.type.value;
        emitParticles(c.x + c.w / 2, c.y + c.h / 2, '#22d3ee', 8);
      }
      state.score += 10;
      collectibles.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); }
  }
}

// ── Render ──
function render() {
  ctx.clearRect(0, 0, W, H);

  drawRoad();

  // Draw entities behind player
  for (const o of obstacles) drawObstacle(o);
  for (const c of collectibles) drawCollectible(c);

  drawTricycle();

  // Draw particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  drawHUD();

  if (!state.started) drawStartScreen();
  if (state.gameOver) drawGameOver();
}

// ── Game Loop ──
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ── Reset ──
function resetGame() {
  state.score = 0;
  state.gold = 0;
  state.gems = 0;
  state.gameOver = false;
  state.started = false;
  state.speed = state.baseSpeed;
  state.frame = 0;
  obstacles = [];
  collectibles = [];
  particles = [];
  spawnTimer = 0;
  player.x = 200;
}

function startGame() {
  resetGame();
  state.started = true;
  state.gameOver = false;
}

// ── Input ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;

  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (state.gameOver) startGame();
    else if (!state.started) startGame();
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Touch support for mobile
let touchX = null;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchX = e.touches[0].clientX - rect.left;

  if (state.gameOver || !state.started) {
    startGame();
    return;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!state.started || state.gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const tx = e.touches[0].clientX - rect.left;
  const scaleX = W / rect.width;
  player.x += (tx - touchX) * scaleX;
  player.x = Math.max(56, Math.min(W - 56, player.x));
  touchX = tx;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  touchX = null;
});

// ── Polyfill roundRect ──
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    return this;
  };
}

// ── Go ──
resetGame();
loop();
</script>
</body>
</html>
