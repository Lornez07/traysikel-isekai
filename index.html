<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traysikel Isekai: Grand Line Cruise</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Pirata+One&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Rajdhani',sans-serif}
.game-wrapper{position:relative;border-radius:20px;padding:4px;background:linear-gradient(135deg,#ef4444,#f59e0b,#ef4444);box-shadow:0 0 60px rgba(239,68,68,0.25),0 0 120px rgba(245,158,11,0.1)}
canvas{display:block;border-radius:16px;background:#0f0f1a;width:900px;height:600px}
</style>
</head>
<body>
<div class="game-wrapper"><canvas id="game" width="900" height="600"></canvas></div>
<script>
const C=document.getElementById('game'),ctx=C.getContext('2d');
const W=900,H=600,CX=W/2,CY=H/2;

// ── RNG ──
const rand=(a,b)=>Math.random()*(b-a)+a;
const randI=(a,b)=>Math.floor(rand(a,b+1));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,m,M)=>Math.max(m,Math.min(M,v));
const lerp=(a,b,t)=>a+(b-a)*t;

// ── Upgrades Pool ──
const UPGRADES=[
  {id:'gomu',name:'Gomu Gomu no Gatling',desc:'Auto melee fists surround the tricycle',color:'#ef4444',icon:'👊'},
  {id:'mera',name:'Mera Mera Engine',desc:'Trail of fire damages chasing enemies',color:'#f97316',icon:'🔥'},
  {id:'zoro',name:"Zoro's Santoryu Slashes",desc:'Spinning sword waves left & right',color:'#22c55e',icon:'⚔️'},
  {id:'sogeking',name:'Sogeking Sight',desc:'+50% attack range & projectile speed',color:'#facc15',icon:'🎯'},
  {id:'chopper',name:"Chopper's Rumble Ball",desc:'Restore 50% HP + armor 10s',color:'#ec4899',icon:'🩺'},
];

// ── Quests ──
const QUESTS=[
  {id:'survive',text:'Survive the Buster Call',desc:'Survive for 60 seconds',check:s=>s.surviveTimer>=6000,reward:{exp:300,beli:500}},
  {id:'defeat',text:'Defeat Marine Captains',desc:'Defeat 15 Marine Captains',check:s=>s.captainKills>=15,reward:{exp:400,beli:800}},
  {id:'escort',text:"Escort Luffy's Meat Barrel",desc:'Push the barrel to the escape circle',check:s=>s.escortDone,reward:{exp:500,beli:1000}},
];

// ── Game State ──
const G={
  phase:'start', // start | playing | levelUp | gameOver
  frame:0,
  time:0,
  // player
  p:{
    x:CX,y:CY,w:40,h:30,
    hp:100,maxHp:100,
    cola:100,maxCola:100,
    colaBurn:0.15,
    speed:3.2,
    exp:0,expNext:100,level:1,
    beli:0,
    attackRange:180,
    attackSpeed:30,
    attackTimer:0,
    armor:0,
    armorTimer:0,
    upgrades:[],
    vx:0,vy:0,
    invincible:0,
  },
  // entities
  enemies:[],
  projectiles:[],
  particles:[],
  colaCrates:[],
  waves:[],
  // quest
  quest:null,
  questProgress:0,
  surviveTimer:0,
  captainKills:0,
  escortBarrel:null,
  escortCircle:null,
  escortDone:false,
  // level up
  levelChoices:[],
  // spawn
  spawnTimer:0,
  waveTimer:0,
  difficulty:1,
  // stats
  totalKills:0,
};

// ── Helpers ──
function addParticles(x,y,color,count=10,spd=3,size=4){
  for(let i=0;i<count;i++){
    const a=rand(0,Math.PI*2),s=rand(1,spd);
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.015+rand(0,0.02),size:rand(2,size),color})
  }
}

function emitText(x,y,text,color='#fff',size=16){
  G.particles.push({x,y,text,color,size,life:1,decay:0.025,vy:-1.5,type:'text'});
}

// ── Spawn ──
function spawnEnemy(type){
  const e={x:0,y:0,w:30,h:30,hp:0,maxHp:0,speed:0,type,attackCooldown:0,damage:0,expValue:0,beliValue:0,facing:0};
  // spawn at random edge
  const side=randI(0,3);
  if(side===0){e.x=rand(20,W-20);e.y=-30}
  else if(side===1){e.x=W+30;e.y=rand(20,H-20)}
  else if(side===2){e.x=rand(20,W-20);e.y=H+30}
  else{e.x=-30;e.y=rand(20,H-20)}

  if(type==='grunt'){
    e.w=26;e.h=26;e.hp=20;e.maxHp=20;e.speed=1.2+rand(0,0.4);
    e.damage=5;e.expValue=8;e.beliValue=5;e.color='#64748b';
  }else if(type==='captain'){
    e.w=30;e.h=30;e.hp=35;e.maxHp=35;e.speed=0.9+rand(0,0.3);
    e.damage=8;e.expValue=15;e.beliValue=12;e.color='#3b82f6';
    e.range=200;e.shootTimer=0;e.shootInterval=80;
  }else if(type==='boss'){
    e.w=48;e.h=48;e.hp=200;e.maxHp=200;e.speed=0.6+rand(0,0.2);
    e.damage=20;e.expValue=80;e.beliValue=100;e.color='#dc2626';
    e.range=250;e.shootTimer=0;e.shootInterval=100;e.boss=true;
  }
  G.enemies.push(e);
}

function spawnColaCrate(x,y){
  G.colaCrates.push({x,y,w:18,h:18,life:1});
}

function spawnWave(waveNum){
  const count=3+waveNum*2;
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      if(G.phase!=='playing')return;
      spawnEnemy('grunt');
      if(waveNum>=2&&Math.random()<0.3)spawnEnemy('captain');
      if(waveNum>=4&&Math.random()<0.5)spawnEnemy('captain');
    },i*400);
  }
  if(waveNum>=3){
    setTimeout(()=>{if(G.phase==='playing')spawnEnemy('captain')},500);
    setTimeout(()=>{if(G.phase==='playing')spawnEnemy('captain')},1000);
  }
  if(waveNum>=5&&waveNum%2===0){
    setTimeout(()=>{if(G.phase==='playing')spawnEnemy('boss')},1500);
  }
}

// ── Quest System ──
function pickQuest(){
  const pool=QUESTS.filter(q=>q.id!=='escort'||!G.escortDone);
  G.quest=pool[randI(0,pool.length-1)];
  G.questProgress=0;
  if(G.quest.id==='escort'){
    G.escortDone=false;
    // spawn barrel near player
    G.escortBarrel={x:rand(100,W-100),y:rand(100,H-100),w:20,h:20,grabbed:false};
    // spawn escape circle on opposite side
    G.escortCircle={x:rand(100,W-100),y:rand(100,H-100),r:40};
    // ensure they're far apart
    while(dist(G.escortBarrel,G.escortCircle)<300){
      G.escortCircle={x:rand(100,W-100),y:rand(100,H-100),r:40};
    }
  }
}

function completeQuest(){
  if(!G.quest)return;
  const r=G.quest.reward;
  G.p.exp+=r.exp;
  G.p.beli+=r.beli;
  emitText(CX,200,'QUEST COMPLETE! +'+r.exp+'EXP +'+r.beli+' Beli','#facc15',28);
  // spawn bonus cola
  for(let i=0;i<3;i++)spawnColaCrate(rand(100,W-100),rand(100,H-100));
  // check level up
  checkLevelUp();
  setTimeout(pickQuest,2000);
}

// ── Level Up ──
function checkLevelUp(){
  if(G.p.exp>=G.p.expNext){
    G.p.exp-=G.p.expNext;
    G.p.expNext=Math.floor(G.p.expNext*1.5)+50;
    G.p.level++;
    showLevelUp();
  }
}

function showLevelUp(){
  G.phase='levelUp';
  // pick 3 random choices
  const pool=[...UPGRADES];
  G.levelChoices=[];
  for(let i=0;i<3&&pool.length>0;i++){
    const idx=randI(0,pool.length-1);
    G.levelChoices.push(pool.splice(idx,1)[0]);
  }
}

function applyUpgrade(up){
  const p=G.p;
  if(up.id==='gomu'){if(!p.upgrades.includes('gomu'))p.upgrades.push('gomu')}
  else if(up.id==='mera'){if(!p.upgrades.includes('mera'))p.upgrades.push('mera')}
  else if(up.id==='zoro'){if(!p.upgrades.includes('zoro'))p.upgrades.push('zoro')}
  else if(up.id==='sogeking'){p.attackRange*=1.5;p.attackSpeed*=0.66}
  else if(up.id==='chopper'){p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.5);p.armor=0.5;p.armorTimer=600}
  G.phase='playing';
}

// ── Player Movement ──
function updatePlayer(){
  const p=G.p;
  p.vx=0;p.vy=0;
  if(K.UP||K.W)p.vy=-1;
  if(K.DOWN||K.S)p.vy=1;
  if(K.LEFT||K.A)p.vx=-1;
  if(K.RIGHT||K.D)p.vx=1;
  if(p.vx!==0||p.vy!==0){
    const len=Math.hypot(p.vx,p.vy);
    p.vx/=len;p.vy/=len;
  }
  p.x+=p.vx*p.speed;
  p.y+=p.vy*p.speed;
  p.x=clamp(p.x,30,W-30);
  p.y=clamp(p.y,50,H-30);

  // cola drain
  p.cola-=p.colaBurn;
  if(p.cola<=0){p.cola=0;G.phase='gameOver';return}

  // invincibility
  if(p.invincible>0)p.invincible--;

  // armor timer
  if(p.armorTimer>0){p.armorTimer--;if(p.armorTimer<=0)p.armor=0}

  // attack
  if(p.attackTimer>0)p.attackTimer--;
  if(p.attackTimer<=0){
    let nearest=null,nd=Infinity;
    for(const e of G.enemies){
      const d=dist(p,e);
      if(d<p.attackRange&&d<nd){nd=d;nearest=e}
    }
    if(nearest){
      p.attackTimer=p.attackSpeed;
      const a=Math.atan2(nearest.y-p.y,nearest.x-p.x);
      G.projectiles.push({
        x:p.x,y:p.y,w:6,h:6,
        vx:Math.cos(a)*5,vy:Math.sin(a)*5,
        damage:10+p.level*2,
        life:1,color:'#facc15',owner:'player',
      });
      // sound effect substitute: muzzle flash particle
      addParticles(p.x+Math.cos(a)*25,p.y+Math.sin(a)*25,'#facc15',4,2,3);
    }
  }

  // Zoro slashes
  if(p.upgrades.includes('zoro')&&G.frame%40===0){
    const angles=[-Math.PI/2,Math.PI/2];
    for(const a of angles){
      G.projectiles.push({
        x:p.x,y:p.y,w:20,h:6,
        vx:Math.cos(a)*4,vy:Math.sin(a)*4,
        damage:8+p.level,
        life:1,color:'#22c55e',owner:'player',type:'slash',
      });
    }
  }

  // Gomu fists (melee aura)
  if(p.upgrades.includes('gomu')){
    const fistR=50;
    for(const e of G.enemies){
      if(dist(p,e)<fistR+e.w/2){
        e.hp-=2+p.level;
        addParticles(e.x,e.y,'#ef4444',3,2,3);
      }
    }
  }

  // Mera fire trail
  if(p.upgrades.includes('mera')&&(p.vx!==0||p.vy!==0)&&G.frame%8===0){
    const tx=p.x-p.vx*15+rand(-8,8),ty=p.y-p.vy*15+rand(-8,8);
    G.particles.push({x:tx,y:ty,life:1,decay:0.04,size:rand(4,8),color:'#f97316',type:'fire'});
    // fire damages enemies on trail
    for(const e of G.enemies){
      if(dist({x:tx,y:ty},e)<25){e.hp-=1.5;addParticles(e.x,e.y,'#f97316',2,1,2)}
    }
  }
}

// ── Enemy AI ──
function updateEnemies(){
  const p=G.p;
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    // move toward player
    const a=Math.atan2(p.y-e.y,p.x-e.x);
    e.facing=a;
    if(e.type==='grunt'||e.type==='boss'){
      const d=dist(p,e);
      if(d>25){
        e.x+=Math.cos(a)*e.speed;
        e.y+=Math.sin(a)*e.speed;
      }else{
        // melee attack
        if(e.attackCooldown<=0){
          let dmg=e.damage;
          if(p.armor>0)dmg*=(1-p.armor);
          p.hp-=dmg;
          p.invincible=15;
          e.attackCooldown=40;
          addParticles(p.x,p.y,'#ef4444',8,3,5);
          // knockback
          p.x-=Math.cos(a)*15;p.y-=Math.sin(a)*15;
          p.x=clamp(p.x,30,W-30);p.y=clamp(p.y,50,H-30);
        }
      }
    }else if(e.type==='captain'){
      const d=dist(p,e);
      if(d>e.range*0.6){
        e.x+=Math.cos(a)*e.speed;
        e.y+=Math.sin(a)*e.speed;
      }else{
        // strafe slightly
        e.x+=Math.cos(a+Math.PI/2)*e.speed*0.4;
        e.y+=Math.sin(a+Math.PI/2)*e.speed*0.4;
      }
      // ranged attack
      if(e.shootTimer<=0&&d<e.range){
        e.shootTimer=e.shootInterval;
        const sa=Math.atan2(p.y-e.y,p.x-e.x)+rand(-0.15,0.15);
        G.projectiles.push({
          x:e.x,y:e.y,w:5,h:5,
          vx:Math.cos(sa)*3.5,vy:Math.sin(sa)*3.5,
          damage:e.damage,life:1,color:'#3b82f6',owner:'enemy',
        });
      }
      if(e.shootTimer>0)e.shootTimer--;
    }

    if(e.attackCooldown>0)e.attackCooldown--;

    // keep in bounds (slightly)
    e.x=clamp(e.x,-50,W+50);e.y=clamp(e.y,-50,H+50);

    // check death
    if(e.hp<=0){
      // drop loot
      const dropChance=e.type==='boss'?1:0.4;
      if(Math.random()<dropChance)spawnColaCrate(e.x+rand(-10,10),e.y+rand(-10,10));
      // exp & beli
      G.p.exp+=e.expValue;
      G.p.beli+=e.beliValue;
      if(e.type==='captain')G.captainKills++;
      G.totalKills++;
      emitText(e.x,e.y,'+'+e.expValue+'EXP','#a78bfa',14);
      addParticles(e.x,e.y,'#fff',15,4,6);
      if(e.boss)addParticles(e.x,e.y,'#dc2626',30,6,10);
      G.enemies.splice(i,1);
      checkLevelUp();
      continue;
    }

    // off-screen despawn (behind spawn edge)
    if(e.x<-100||e.x>W+100||e.y<-100||e.y>H+100){
      G.enemies.splice(i,1);
    }
  }
}

// ── Projectiles ──
function updateProjectiles(){
  for(let i=G.projectiles.length-1;i>=0;i--){
    const b=G.projectiles[i];
    b.x+=b.vx;b.y+=b.vy;
    // out of bounds
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){G.projectiles.splice(i,1);continue}
    // hit enemies
    if(b.owner==='player'){
      let hit=false;
      for(const e of G.enemies){
        if(Math.abs(b.x-e.x)<e.w/2+8&&Math.abs(b.y-e.y)<e.h/2+8){
          e.hp-=b.damage;
          addParticles(b.x,b.y,'#facc15',5,2,3);
          hit=true;break;
        }
      }
      if(hit){G.projectiles.splice(i,1)}
    }else if(b.owner==='enemy'){
      const p=G.p;
      if(Math.abs(b.x-p.x)<p.w/2+8&&Math.abs(b.y-p.y)<p.h/2+8){
        let dmg=b.damage;
        if(p.armor>0)dmg*=(1-p.armor);
        p.hp-=dmg;
        p.invincible=10;
        addParticles(p.x,p.y,'#ef4444',6,3,4);
        G.projectiles.splice(i,1);
      }
    }
  }
}

// ── Cola Crates ──
function updateColaCrates(){
  const p=G.p;
  for(let i=G.colaCrates.length-1;i>=0;i--){
    const c=G.colaCrates[i];
    if(dist(p,c)<p.w/2+c.w/2+8){
      p.cola=Math.min(p.maxCola,p.cola+25);
      addParticles(c.x,c.y,'#22d3ee',12,4,5);
      emitText(c.x,c.y,'+25 Cola','#22d3ee',16);
      G.colaCrates.splice(i,1);
    }
  }
}

// ── Escort Quest ──
function updateEscort(){
  if(!G.quest||G.quest.id!=='escort'||G.escortDone)return;
  const b=G.escortBarrel,c=G.escortCircle,p=G.p;
  // barrel follows player when close (push it)
  if(dist(p,b)<40){
    const a=Math.atan2(b.y-p.y,b.x-p.x);
    b.x+=Math.cos(a)*1.8;
    b.y+=Math.sin(a)*1.8;
    b.x=clamp(b.x,30,W-30);b.y=clamp(b.y,50,H-50);
  }
  // check if barrel reached circle
  if(dist(b,c)<c.r){
    G.escortDone=true;
    completeQuest();
  }
}

// ── Quests ──
function updateQuest(){
  if(!G.quest)return;
  if(G.quest.id==='survive'){
    G.surviveTimer++;
    if(G.quest.check(G))completeQuest();
  }else if(G.quest.id==='defeat'){
    if(G.quest.check(G))completeQuest();
  }else if(G.quest.id==='escort'){
    updateEscort();
  }
}

// ── Spawning ──
function updateSpawning(){
  G.spawnTimer++;
  const rate=Math.max(30,100-G.difficulty*8);
  if(G.spawnTimer>=rate){
    G.spawnTimer=0;
    if(Math.random()<0.5)spawnEnemy('grunt');
    if(G.difficulty>=2&&Math.random()<0.25)spawnEnemy('captain');
  }
  // waves
  G.waveTimer++;
  if(G.waveTimer>=1200){ // ~20 seconds
    G.waveTimer=0;
    G.difficulty++;
    spawnWave(G.difficulty);
  }
}

// ── Particles ──
function updateParticles(){
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    if(p.type==='text'){
      p.y+=p.vy||-1;
      p.life-=p.decay;
    }else if(p.type==='fire'){
      p.life-=p.decay;
      p.x+=rand(-0.5,0.5);
      p.y+=rand(-0.5,0.5);
      p.size*=0.97;
    }else{
      p.x+=p.vx;p.y+=p.vy;
      p.vy+=0.05;
      p.life-=p.decay;
    }
    if(p.life<=0)G.particles.splice(i,1);
  }
}

// ── Drawing ──

function drawBackground(){
  // dock/sea floor pattern
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,0,W,H);
  // stone tile grid
  const ts=48;
  for(let x=0;x<W;x+=ts){
    for(let y=0;y<H;y+=ts){
      const idx=Math.floor(x/ts)+(Math.floor(y/ts)%2===0?1:0);
      ctx.fillStyle=idx%2===0?'#1e1e32':'#22223a';
      ctx.fillRect(x,y,ts,ts);
      ctx.strokeStyle='#2a2a45';
      ctx.lineWidth=0.5;
      ctx.strokeRect(x,y,ts,ts);
    }
  }
  // water reflection overlay
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'rgba(59,130,246,0.05)');
  grd.addColorStop(0.5,'rgba(59,130,246,0.02)');
  grd.addColorStop(1,'rgba(59,130,246,0.05)');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);

  // subtle wave lines
  ctx.strokeStyle='rgba(59,130,246,0.06)';
  ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    const wy=100+i*120+Math.sin(G.frame*0.01+i)*20;
    ctx.beginPath();
    for(let x=0;x<W;x+=10){
      ctx.lineTo(x,wy+Math.sin(x*0.03+G.frame*0.02)*8);
    }
    ctx.stroke();
  }
}

function drawTricycle(){
  const p=G.p;
  ctx.save();
  ctx.translate(p.x,p.y);

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0,16,24,5,0,0,Math.PI*2);
  ctx.fill();

  // invincibility flash
  if(p.invincible>0&&Math.floor(G.frame/4)%2===0){
    ctx.globalAlpha=0.5;
  }

  // Body
  const grad=ctx.createLinearGradient(-20,-12,20,12);
  grad.addColorStop(0,'#dc2626');
  grad.addColorStop(0.5,'#ef4444');
  grad.addColorStop(1,'#b91c1c');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.roundRect(-20,-12,40,24,5);
  ctx.fill();

  // Franky star on hood
  ctx.fillStyle='#facc15';
  ctx.font='14px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('★',14,-4);

  // Gold trim
  ctx.strokeStyle='#f59e0b';
  ctx.lineWidth=1.5;
  ctx.shadowColor='#f59e0b';
  ctx.shadowBlur=6;
  ctx.beginPath();
  ctx.roundRect(-20,-12,40,24,5);
  ctx.stroke();
  ctx.shadowBlur=0;

  // Sidecar
  ctx.fillStyle='#991b1b';
  ctx.beginPath();
  ctx.roundRect(-28,0,16,14,4);
  ctx.fill();
  ctx.strokeStyle='#f59e0b';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.roundRect(-28,0,16,14,4);
  ctx.stroke();

  // Wheels
  const wheels=[
    [-14,16],[6,16],[-20,16]
  ];
  for(const[wX,wY]of wheels){
    ctx.shadowColor='#818cf8';
    ctx.shadowBlur=6;
    ctx.fillStyle='#1e1b4b';
    ctx.beginPath();
    ctx.arc(wX,wY,6,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#4338ca';
    ctx.beginPath();
    ctx.arc(wX,wY,2.5,0,Math.PI*2);
    ctx.fill();
  }

  // Cola exhaust flame
  if(p.vx!==0||p.vy!==0){
    const flicker=rand(3,8);
    ctx.fillStyle='#f97316';
    ctx.shadowColor='#f97316';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.moveTo(-24,rand(-4,4));
    ctx.lineTo(-24-flicker,rand(-6,6));
    ctx.lineTo(-24,rand(-2,2));
    ctx.fill();
    ctx.shadowBlur=0;
  }

  // Merry go-fur
  ctx.fillStyle='#fef08a';
  ctx.shadowColor='#fef08a';
  ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.arc(22,-2,2.5,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();
}

function drawProjectiles(){
  for(const b of G.projectiles){
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.fillStyle=b.color;
    ctx.shadowColor=b.color;
    ctx.shadowBlur=10;
    if(b.type==='slash'){
      ctx.strokeStyle=b.color;
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,0,12,0,Math.PI*1.5);
      ctx.stroke();
    }else{
      ctx.beginPath();
      ctx.arc(0,0,3,0,Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.restore();
  }

function drawParticles(){
  for(const p of G.particles){
    ctx.save();
    ctx.globalAlpha=p.life;
    if(p.type==='text'){
      ctx.fillStyle=p.color;
      ctx.font=`bold ${p.size}px Rajdhani,sans-serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(p.text,p.x,p.y);
    }else if(p.type==='fire'){
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;
      ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }else{
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;
      ctx.shadowBlur=6;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

// ── Main Update ──
function update(){
  G.frame++;
  if(G.phase==='start'||G.phase==='levelUp'||G.phase==='gameOver')return;

  G.time++;
  updatePlayer();
  if(G.phase==='gameOver')return;
  updateEnemies();
  updateProjectiles();
  updateColaCrates();
  updateSpawning();
  updateQuest();
  updateParticles();

  // HP check
  if(G.p.hp<=0){G.p.hp=0;G.phase='gameOver'}
}

// ── Main Render ──
function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();

  if(G.phase==='start'){
    drawStartScreen();
    return;
  }

  drawColaCrates();
  drawEscortQuest();
  drawEnemies();
  drawProjectiles();
  drawTricycle();
  drawParticles();
  drawHUD();

  if(G.phase==='gameOver')drawGameOver();
  if(G.phase==='levelUp')drawLevelUp();
}

// ── Game Loop ──
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

// ── Reset ──

  G.enemies=[];G.projectiles=[];G.particles=[];
  G.colaCrates=[];
  G.spawnTimer=0;G.waveTimer=0;G.difficulty=1;
  G.totalKills=0;G.captainKills=0;
  G.surviveTimer=0;
  G.escortDone=false;
  G.escortBarrel=null;G.escortCircle=null;
  G.quest=null;
  pickQuest();
}

// ── Keyboard ──
const K={UP:false,DOWN:false,LEFT:false,RIGHT:false,W:false,A:false,S:false,D:false};
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowUp'){K.UP=true;e.preventDefault()}
  if(k==='ArrowDown'){K.DOWN=true;e.preventDefault()}
  if(k==='ArrowLeft'){K.LEFT=true;e.preventDefault()}
  if(k==='ArrowRight'){K.RIGHT=true;e.preventDefault()}
  if(k==='w'||k==='W')K.W=true;
  if(k==='a'||k==='A')K.A=true;
  if(k==='s'||k==='S')K.S=true;
  if(k==='d'||k==='D')K.D=true;
  if(k===' '||k==='Spacebar'){
    e.preventDefault();
    if(G.phase==='start')resetGame();
    else if(G.phase==='gameOver')resetGame();
  }
});
document.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowUp')K.UP=false;
  if(k==='ArrowDown')K.DOWN=false;
  if(k==='ArrowLeft')K.LEFT=false;
  if(k==='ArrowRight')K.RIGHT=false;
  if(k==='w'||k==='W')K.W=false;
  if(k==='a'||k==='A')K.A=false;
  if(k==='s'||k==='S')K.S=false;
  if(k==='d'||k==='D')K.D=false;
});

// ── Click for Level Up ──
canvas.addEventListener('click',e=>{
  if(G.phase!=='levelUp')return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
  const choices=G.levelChoices;
  for(let i=0;i<choices.length;i++){
    const y=190+i*120;
    if(mx>=210&&mx<=690&&my>=y&&my<=y+100){
      applyUpgrade(choices[i]);
      break;
    }
  }
});

// ── Touch for Level Up ──
canvas.addEventListener('touchstart',e=>{
  if(G.phase!=='levelUp')return;
  e.preventDefault();
  const touch=e.touches[0];
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const mx=(touch.clientX-rect.left)*scaleX,my=(touch.clientY-rect.top)*scaleY;
  const choices=G.levelChoices;
  for(let i=0;i<choices.length;i++){
    const y=190+i*120;
    if(mx>=210&&mx<=690&&my>=y&&my<=y+100){
      applyUpgrade(choices[i]);
      break;
    }
  }
},{passive:false});

// ── Touch drive ──
let touchId=null,touchX=null,touchY=null;
canvas.addEventListener('touchstart',e=>{
  if(G.phase==='start'||G.phase==='gameOver'){resetGame();return}
  if(G.phase!=='playing')return;
  e.preventDefault();
  const t=e.touches[0];
  touchId=t.identifier;
  touchX=t.clientX;touchY=t.clientY;
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(G.phase!=='playing')return;
  e.preventDefault();
  const t=Array.from(e.touches).find(t=>t.identifier===touchId)||e.touches[0];
  const rect=canvas.getBoundingClientRect();
  const cx=t.clientX-rect.left,cy=t.clientY-rect.top;
  const dx=cx-W/2,dy=cy-H/2;
  const len=Math.hypot(dx,dy);
  if(len>20){
    G.p.vx=dx/len;G.p.vy=dy/len;
    G.p.x+=G.p.vx*G.p.speed;
    G.p.y+=G.p.vy*G.p.speed;
    G.p.x=clamp(G.p.x,30,W-30);G.p.y=clamp(G.p.y,50,H-30);
  }
  touchX=t.clientX;touchY=t.clientY;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  touchId=null;
  G.p.vx=0;G.p.vy=0;
});

// ── Polyfill roundRect ──
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

// ── Init ──
loop();
</script>
